<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 24px; }
        .wrapper { max-width: 580px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; text-align: center; }
        .button { display: inline-block; padding: 10px 20px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="wrapper">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        &copy; {{ config("app.name") }}. All rights reserved.
    </div>
</body>
</html>
