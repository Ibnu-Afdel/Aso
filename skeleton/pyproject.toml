[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "An Aso application"
requires-python = ">=3.12"
dependencies = [
    "aso",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-cov>=7",
]

# Dev checkouts (and `aso new --dev`) point this at the framework's own repo, editable.
# `aso new` (without --dev) removes this table and pins `aso` to a released version.
[tool.uv.sources]
aso = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app", "bootstrap", "config", "database", "routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aso"]
known-local-folder = ["app", "bootstrap", "config", "routes", "database"]
