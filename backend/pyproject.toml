[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + aiogram template"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "aiogram==3.6.0",
  "SQLAlchemy==2.0.30",
  "asyncpg==0.29.0",
  "aiosqlite==0.20.0",
  "pydantic-settings==2.3.4",
  "alembic==1.13.1",
  "python-dotenv==1.0.1",
  "redis==5.0.4",
  "typer==0.12.3",
  "loguru==0.7.2",
  "ruff==0.9.5",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ipython==8.22.2",
]

[project.scripts]
fast = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
